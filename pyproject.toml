[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torrent-crawler"
version = "2.0.0"
description = "A lightweight and high-performance TUI for searching movie torrents and subtitles."
readme = "README.md"
authors = [
    { name = "fastfingertips" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual>=8.0.0",
    "curl_cffi>=0.14.0",
    "beautifulsoup4>=4.14.3",
    "html5lib>=1.1",
    "typer>=0.24.1",
    "loguru>=0.7.3",
    "beaupy>=3.11.0",
    "rich>=14.3.3",
    "Flask>=3.1.3",
    "dynaconf>=3.2.12"
]

[project.scripts]
torrent-crawler = "torrent_crawler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["torrent_crawler*"]
